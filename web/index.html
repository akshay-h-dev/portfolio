  <style>
    html, body { background-color: #000000; height: 100%; }
    /* Lightweight CSS loading splash so first paint isn't a blank canvas.
       The percentage is a simulated approximation (see script below) —
       Flutter's web bootstrap doesn't expose real byte-level download
       progress, so this eases toward ~92% and only ever snaps to 100%
       at the real moment `flutter-first-frame` fires, so it's never
       inaccurate about when the app is actually ready. */
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #000000; z-index: 9999; transition: opacity .4s ease;
    }
    #app-loading .spinner-wrap { position: relative; width: 64px; height: 64px; }
    #app-loading .spinner {
      width: 64px; height: 64px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #35E7E0;
      animation: spin 0.9s linear infinite;
    }
    #app-loading .percentage {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px; color: #F5F7FA;
    }
    #app-loading .label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px; letter-spacing: 1px; color: #6B7280;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="percentage" id="app-loading-percentage">0%</div>
    </div>
    <div class="label">Initializing Portfolio...</div>
  </div>

  <!-- SEO fallback content: present in the static DOM for crawlers and
       screen readers before (or if) the Flutter app takes over. -->
  <noscript>
    <h1>Akshay H — Flutter Developer, Backend Developer</h1>
    <p>Building scalable mobile applications, backend systems, and innovative solutions through modern technologies. View projects, skills, and blog at akshayh.dev.</p>
  </noscript>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var el = document.getElementById('app-loading-percentage');
      var pct = 0;
      var done = false;

      // Eases toward ~92% and stalls there — real completion is signalled
      // by the 'flutter-first-frame' event below, never by this timer.
      var interval = setInterval(function () {
        if (done) { clearInterval(interval); return; }
        var remaining = 92 - pct;
        pct += Math.max(remaining * 0.06, 0.15);
        if (pct >= 92) pct = 92;
        if (el) el.textContent = Math.floor(pct) + '%';
      }, 120);

      window.addEventListener('flutter-first-frame', function () {
        done = true;
        clearInterval(interval);
        if (el) el.textContent = '100%';
        var wrap = document.getElementById('app-loading');
        setTimeout(function () {
          if (wrap) {
            wrap.style.opacity = '0';
            setTimeout(function () { wrap.remove(); }, 400);
          }
        }, 150);
      });
    })();
  </script>
</body>
</html>
